<!DOCTYPE html>
<!--
    To do list:
    Add a circular favicon for the google search results.

-->

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>ECF Player Analytics | Simplest way to analyze ECF player data.</title>
        <meta name="description" content="Do you want to graph your ECF rating, or analyze your game results? Then this is the site. A simple, reliable, and straightforward website to graph your ECF rating for you.">
        <meta name="keywords" content="ECF analytics, How to graph my ECF rating, ECF player analysis, How to see my ECF winrate, ECF">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="assets/modules/popups.css">
        <link rel="icon" href="assets/icons/ecf-grapher.ico">
    </head>
    <body>
        <div id="choose_settings_page">
            <div style="font-size: 2.5rem; font-weight: 600; text-align: center; margin-block: 30px;">
                Choose your Inputs
            </div>
            <div class="settings_container">
                <div class="settings_box">
                    <span class="input_prompt">Person</span>
                    <label class="field_label" for="rating_code_input">ECF Rating Code</label>
                    <input type="text" class="textinput" id="rating_code_input" placeholder="E.g. 123456">
                </div>

                <div class="settings_box">
                    <span class="input_prompt">
                        Time Controls
                    </span>
                    <div class="time_controls">
                        <label class="check_pair_container" for="S_input">
                            <span>Standard</span>
                            <input type="checkbox" class="check" id="S_input" checked>
                        </label>
                        <label class="check_pair_container" for="R_input">
                            <span>Rapid</span>
                            <input type="checkbox" class="check" id="R_input">
                        </label>
                        <label class="check_pair_container" for="B_input">
                            <span>Blitz</span>
                            <input type="checkbox" class="check" id="B_input">
                        </label>
                    </div>
                </div>

                <div class="settings_box">
                    <label class="input_prompt" for="timescale_input">
                        Timescale (months)
                    </label>
                    <input type="number" class="textinput" min="1" id="timescale_input" value="48">
                </div>
            </div>
            <button id="go_button">
                Go
            </button>
        </div>

        <template id="loading_screen">
            <div style="height: 100vh; width: 100vw; text-align: center; display: flex; flex-direction: column; justify-content: center;">
                <span style="font-size: 3rem;">Retrieving ratings...</span>
            </div>
        </template>

        <template id="info_book">
            <div id="info_book_clon" style="height: 100dvh; width: 100%; box-sizing: border-box; padding: 8px; position: fixed; top: 0; justify-content: center; align-items: center; display: flex; background-color: rgba(0,0,0,0.6); z-index: 1;">
                <div style="box-sizing: border-box; width: min(100%, 800px); min-width: 0; height: min(75vh, 900px); min-height: 0; max-height: calc(100dvh - 16px); background-color: #EEEEEE; border-radius: 5px; z-index: 2;">
                    <div style="min-height:calc(1.5rem + 20px); width: 100%; box-sizing: border-box; display: flex; justify-content: space-between; align-items: stretch; background-color: rgb(98,98,98); border-top-left-radius: 5px; border-top-right-radius: 5px;">
                        <div class="book_tabs" style="display: flex; justify-content: start; align-items: stretch;">
                            <button class="book_tab" style="border-top-left-radius: 5px;" id="btn_1">FAQ's</button>
                            <button class="book_tab" id="btn_3">Troubleshooting</button>
                            <button class="book_tab" id="btn_4">Contact</button>
                        </div>
                        <button id="close_info_book" class="close_button">✖</button>

                    </div>
                    <div style="height: calc(100% - (1.5rem + 20px)); width: 100%; padding: 10px; box-sizing: border-box; overflow-y: auto;">
                        <div id="current_content" style="width: 100%; min-width: 0; overflow-wrap: anywhere;"></div>
                        <template id="faqs">
                            <div style="font-size: 1.2rem;">
                                <h2>FAQ's</h2>
                                <h3>Does this app use original or revised ratings?</h3>
                                <p style="margin: 0px;">
                                    This app uses original ratings.
                                </p>
                                <h3>What is timescale?</h3>
                                <p style="margin: 0px;">
                                    Timescale is how many months are on the x-axis of the graph. It does not affect the game stats, which use the past 5000 games of each time control.
                                </p>
                                <h3>What happens to my data?</h3>
                                <p style="margin: 0px;">
                                    Zero personal data is collected on the site and zero cookies are used. The data is deleted when you close the tab.
                                </p>
                            </div>
                        </template>
                        <template id="contact">
                            <div style="font-size: 1.2rem;">
                                <h2>Contact</h2>
                                <p>
                                    If you have any questions or feedback, please contact the developer at LiuY1902@outlook.com. I might not respond very fast, as I rarely recieve emails, but I will try to get back to you as soon as possible.
                                </p>
                            </div>
                        </template>
                        <template id="troubleshooting">
                            <div style="font-size: 1.2rem;">
                                <h2>Troubleshooting</h2>
                                <p>
                                    This page is meant to help you fix errors you encounter, if you still encounter issues, e-mail liuy1902@outlook.com.
                                </p>
                                <p>
                                    If you get a <b>Failed to fetch</b> error, then it could be from many reasons.
                                    <ol>
                                        <li>The timescale is too large. The timescale limit for each account is different, and the amount of time controls also affects it. The timescale values in the table below could be off by up to 20.
                                            <table style="margin-top: 10px; margin-bottom: 10px;">
                                                <tr style="background-color: rgba(0,0,0,0.05);">
                                                    <th style="font-weight: 500;">No. of Time Controls</th>
                                                    <th style="font-weight: 500;">Approx. Maximum timescale</th>
                                                </tr>
                                                <tr>
                                                    <td>3</td>
                                                    <td>150</td>
                                                </tr>
                                                <tr>
                                                    <td>2</td>
                                                    <td>200</td>
                                                </tr>
                                                <tr>
                                                    <td>1</td>
                                                    <td>505</td>
                                                </tr>
                                            </table> </li>
                                        <li>Your internet connection is not very good.</li>
                                        <li>You have reached the maximum processing time per day. Highly unlikely but only one minute of internet requests to the ECF's server is allowed per device. Each request takes about 15 milliseconds and the number of requests sent is equal to the <span style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;">timescale &times number of time controls </span>, so you probably won't be exceeding that anytime soon.</li>
                                            
                                    </ol>
                                </p>
                                <p>
                                    If you get a <b>Cannot read properties of undefined (reading 'full_name')</b> error, then it is because the ECF rating code is invalid.
                                </p>
                            </div>
                        </template>

                    </div>
                </div>
            </div>
        </template>

        <div style="font-size: 1rem; position: fixed; bottom: 0px; left: 0.3rem; z-index:10; pointer-events: none;">
            This software is not licensed by or affiliated with the ECF.
        </div>
        
        <div style="position: fixed; bottom: 0px; right: 0;">
            <button id="info_button">
                Info
            </button>
        </div>

        <script src="script.js" async defer type="module"></script>
    </body>
</html>
